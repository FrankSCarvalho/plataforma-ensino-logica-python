[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plataforma-ensino-logica-python"
version = "0.1.0"
description = "Plataforma de ensino de lógica de programação"
requires-python = ">=3.13"
dependencies = [
    "flet>=0.80.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["app"]